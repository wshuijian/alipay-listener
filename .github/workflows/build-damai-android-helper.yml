name: Build Damai Android Helper APK

on:
  push:
    paths:
      - "tools/damai-android-helper/**"
      - ".github/workflows/build-damai-android-helper.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle --no-daemon -p tools/damai-android-helper assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: damai-android-helper-debug-apk
          path: tools/damai-android-helper/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
