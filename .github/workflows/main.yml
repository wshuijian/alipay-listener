name: Build Android APK

on:
  push:
    branches: [ main, master, "feature/**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle 8.7
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.7'

    - name: Create gradle.properties
      run: |
        echo "android.useAndroidX=true" > gradle.properties
        echo "android.enableJetifier=true" >> gradle.properties
        echo "org.gradle.jvmargs=-Xmx2048m" >> gradle.properties

    - name: Build Debug APK
      run: gradle assembleDebug

    - name: Generate temp TEST keystore and build signed Release APK
      run: |
        # 仅用于测试签名，不是商业正式签名；CI跑完即销毁，仓库里不存
        keytool -genkeypair -v \
          -keystore /tmp/test-release.jks \
          -alias testkey -keyalg RSA -keysize 2048 -validity 10000 \
          -storepass testpass123 -keypass testpass123 \
          -dname "CN=SmartPay Test, OU=Test, O=SmartPay, L=Anqing, ST=Anhui, C=CN"
        export RELEASE_KEYSTORE=/tmp/test-release.jks
        export RELEASE_KEYSTORE_PASSWORD=testpass123
        export RELEASE_KEY_ALIAS=testkey
        export RELEASE_KEY_PASSWORD=testpass123
        gradle assembleRelease

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: alipay-listener-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Upload Release APK (signed TEST build)
      uses: actions/upload-artifact@v4
      with:
        name: alipay-listener-release-signed-test-apk
        path: app/build/outputs/apk/release/*.apk

    - name: Upload R8 mapping.txt (obfuscation backup)
      uses: actions/upload-artifact@v4
      with:
        name: alipay-listener-r8-mapping
        path: app/build/outputs/mapping/release/mapping.txt
